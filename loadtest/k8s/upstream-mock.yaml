# Upstream mock of the load tests (task 5.3). An nginx Deployment and Service in ingot-loadtest that serve the seeded
# artifacts of the load tests at /seeded/<name>.bin. The latency of every answer is set by LATENCY_MS, in milliseconds.
#
# The generator is not in an image. Create its source ConfigMap before applying this file, from the repository root:
#   kubectl -n ingot-loadtest create configmap upstream-mock-src \
#     --from-file=generate.ts=loadtest/k8s/upstream-mock/generate.ts \
#     --from-file=artifacts.ts=loadtest/lib/artifacts.ts
#
# The init containers run in order: seed writes the artifacts with Node 24, then latency adds the delay with netem on
# the pod network interface. The qdisc stays with the pod network namespace, which nginx shares.
apiVersion: v1
kind: ConfigMap
metadata:
  name: upstream-mock-nginx
  namespace: ingot-loadtest
data:
  default.conf: |
    server {
      listen 8080;

      location /seeded/ {
        alias /srv/seeded/;
        autoindex off;
        default_type application/octet-stream;
      }

      location = /healthz {
        return 200 "ok\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream-mock
  namespace: ingot-loadtest
  labels:
    app.kubernetes.io/name: upstream-mock
    app.kubernetes.io/part-of: ingot-loadtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: upstream-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upstream-mock
        app.kubernetes.io/part-of: ingot-loadtest
    spec:
      initContainers:
        - name: seed
          image: node:24-alpine
          command: ["node", "/src/k8s/upstream-mock/generate.ts", "/srv/seeded"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: source
              mountPath: /src
              readOnly: true
            - name: seeded
              mountPath: /srv/seeded
        - name: latency
          image: alpine:3.22
          env:
            - name: LATENCY_MS
              value: "0"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          command:
            - sh
            - -c
            - |
              if [ "$LATENCY_MS" -gt 0 ]; then
                apk add --no-cache iproute2
                tc qdisc add dev eth0 root netem delay "${LATENCY_MS}ms"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: seeded
              mountPath: /srv/seeded
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: upstream-mock-src
            items:
              - key: generate.ts
                path: k8s/upstream-mock/generate.ts
              - key: artifacts.ts
                path: lib/artifacts.ts
        - name: nginx-config
          configMap:
            name: upstream-mock-nginx
        - name: seeded
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: upstream-mock
  namespace: ingot-loadtest
  labels:
    app.kubernetes.io/name: upstream-mock
    app.kubernetes.io/part-of: ingot-loadtest
spec:
  selector:
    app.kubernetes.io/name: upstream-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
