# Topology overlay of the load tests. The runner adds the pod size, the storage backend and the image.
# The shared PostgreSQL, bucket and NATS are the same in every overlay, so a difference between two topologies is a
# difference of the shape. Secrets and the NATS server live in the ingot-loadtest namespace.
# The all-in-one workload with three replicas behind one Service.
mode: allInOne
deployment:
  replicas: 3
database:
  existingSecret: ingot-loadtest-database
  secretKey: database
objectStorage:
  existingSecret: ingot-loadtest-s3
clusterBus:
  url: nats://nats.ingot-loadtest.svc.cluster.local:4222
# The three replicas cannot share the chart's ReadWriteOnce claim: on a storage class that attaches a volume to one node,
# the replicas on other nodes never start. The repositories live in the bucket and the settings in PostgreSQL and the
# shared configuration, so each replica keeps its data directory in an emptyDir, as the scalable overlays do.
persistence:
  enabled: false
# The heap is a share of the container limit of the size the runner applies. This replaces the fixed chart default heap, which
# would cap every size at the same heap.
# The in-cluster bucket endpoint has no host name per bucket, so the S3 client addresses the bucket by path. Ingot reads
# that switch only as a JVM system property, not from the storage provider settings the runner writes.
# The runner enables the shared configuration of this overlay, and the chart then sets INGOT_OPTS in env, which wins over
# the INGOT_OPTS of the run Secret. So the token is passed here, as a reference to the password in that Secret.
env:
  - name: JAVA_OPTS
    value: "-XX:MaxRAMPercentage=75 -Dreposilite.s3.pathStyleAccessEnabled=true"
  - name: INGOT_OPTS
    value: "--token loadtest:$(LOADTEST_PASSWORD)"
