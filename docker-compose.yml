# The server on its own, serving the dashboard itself.
#
# This is the simpler deployment and the one to start from. To run the dashboard in its own
# container instead, see docker-compose.split.yml next to this file.
services:
  ingot:
    image: ghcr.io/onelitefeathernet/ingot:1.1.0 # x-release-please-version
    #
    # To build from sources:
    #
    # build:
    #  context: .
    #  dockerfile: Dockerfile
    ports:
      - ${PORT}:${PORT}
    env_file:
      - .env
    environment:
      - JAVA_OPTS=-Xmx${MEMORY} ${JAVA_COMPOSE_OPTS}
      - INGOT_OPTS=--port ${PORT} ${INGOT_COMPOSE_OPTS}
    volumes:
      - ingot-data:/app/data
    restart: unless-stopped
    stdin_open: true
    tty: true
    security_opt:
      # Nothing in here ever needs a privilege it was not started with.
      - no-new-privileges:true
    #
    # The image starts as root and drops to the service account in its entrypoint, which is
    # what lets it adopt a data directory owned by somebody else and act on PUID and PGID.
    # Once the volume is owned by 977, which is the case after the first start, you can pin
    # the user and skip that step entirely:
    #
    # user: "977:977"
volumes:
  ingot-data: {}
