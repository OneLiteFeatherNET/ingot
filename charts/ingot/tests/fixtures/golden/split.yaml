# Golden render, see tests/test_golden.py. Parsed manifests sorted by kind and name.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: null
  labels:
    app.kubernetes.io/instance: ingot
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ingot
    app.kubernetes.io/version: 1.1.1
    helm.sh/chart: ingot-1.1.1
  name: ingot
  namespace: reposilite-staging
spec:
  minReadySeconds: 0
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ingot
      app.kubernetes.io/name: ingot
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations: null
      labels:
        app.kubernetes.io/instance: ingot
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: ingot
        app.kubernetes.io/version: 1.1.1
        helm.sh/chart: ingot-1.1.1
    spec:
      containers:
      - env:
        - name: INGOT_TARGET
          value: server
        - name: INGOT_CLUSTER_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: JAVA_OPTS
          value: -Xmx64M
        image: ghcr.io/onelitefeathernet/ingot:1.1.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/status/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        name: ingot
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 1
          httpGet:
            path: /api/status/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 2
            memory: 256Mi
          requests:
            cpu: 1
            memory: 128Mi
        stdin: true
        volumeMounts:
        - mountPath: /app/data
          name: data
      serviceAccountName: ingot
      terminationGracePeriodSeconds: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ingot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/instance: ingot-dashboard
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ingot
    app.kubernetes.io/version: 1.1.1
    helm.sh/chart: ingot-1.1.1
  name: ingot-dashboard
  namespace: reposilite-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ingot-dashboard
      app.kubernetes.io/name: ingot
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dashboard
        app.kubernetes.io/instance: ingot-dashboard
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: ingot
        app.kubernetes.io/version: 1.1.1
        helm.sh/chart: ingot-1.1.1
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: INGOT_BACKEND
          value: http://ingot:8080
        image: ghcr.io/onelitefeathernet/ingot-dashboard:1.1.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        name: dashboard
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ingot
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/instance: ingot
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ingot
    app.kubernetes.io/version: 1.1.1
    helm.sh/chart: ingot-1.1.1
  name: ingot
  namespace: reposilite-staging
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
