# Installed by chart-testing in the chart job. The images are the ones that job builds and loads into kind.
# The Secrets and the NATS broker that the typed values name are applied by the chart job first, from the throwaway
# CI values of charts/ingot/tests/ha/dependencies.yaml in the namespace default.
mode: scalable
image:
  name: ingot
  tag: ci
dashboard:
  image:
    name: ingot-dashboard
    tag: ci
database:
  existingSecret: ingot-database
  secretKey: database
objectStorage:
  existingSecret: ingot-s3-keys
clusterBus:
  url: nats://nats.default.svc.cluster.local:4222
persistence:
  enabled: false
