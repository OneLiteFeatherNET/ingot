## Default values for ingot.
## The keys under `deployment`, `service`, `autoscaling`, `ingress`, `resources`, `env`, `rollingUpdate`, `probes`,
## `persistence`, `serviceAccount`, `affinity`, `nodeSelector` and `tolerations` are the keys of the upstream reposilite
## chart 1.4.5 with the same meaning and defaults, so a values file for that chart renders here as well.

## Deploy mode.
## allInOne: one workload of the all-in-one image, which serves the dashboard and the API.
## split: a server workload with INGOT_TARGET=server, and a dashboard workload of the dashboard image in front of it.
mode: allInOne

image:
  name: ghcr.io/onelitefeathernet/ingot
  tag: ""  # defaults to appVersion
  # Pins the server image by digest, for example sha256:... When set, the image is name@digest and the tag is not used.
  digest: ""
  pullPolicy: IfNotPresent

## Typed HA values. Each one renders nothing while it is unset, so a release that sets none of them keeps its manifests.
## Secrets are referenced by name and key. The chart never renders their values.
database:
  # Name of a Secret in the release namespace. Sets INGOT_LOCAL_DATABASE from the key secretKey of that Secret.
  existingSecret: ""
  secretKey: database

objectStorage:
  # Name of a Secret in the release namespace with the keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, and the
  # optional key AWS_REGION. Empty repository keys fall back to the AWS default credential chain.
  existingSecret: ""

clusterBus:
  # URL of the NATS broker. Sets INGOT_CLUSTER_URL.
  url: ""
  # Name of a Secret with the key password. Sets INGOT_CLUSTER_PASSWORD from it.
  passwordSecret: ""
  # Name of a Secret with the key nats.creds. Mounts it read-only and sets INGOT_CLUSTER_CREDENTIALS to the file.
  credentialsSecret: ""

## Name overrides. Set both to `reposilite` to take over the names of an upstream reposilite release.
nameOverride: ""
fullnameOverride: ""

## Deployment configuration of the server
deployment:
  # Number of replicas to be deployed.
  replicas: 1
  # Time in seconds before Kubernetes sends a SIGKILL signal if Ingot doesn't gracefully shut down.
  terminationGracePeriodSeconds: 60
  # The minimum time in seconds Ingot needs to be running before the Deployment controller considers it available.
  minReadySeconds: 0
  # Additional annotations to be added to the Deployment
  annotations: {}
  # Additional labels to be added to the Deployment
  labels: {}
  # Additional annotations to be added to pods
  podAnnotations: {}
  # Additional labels to be added to pods
  podLabels: {}
  # Topology spread constraints of the server pods, passed through unchanged. Empty renders no field.
  # Example: spread the replicas over zones with a constraint on topology.kubernetes.io/zone.
  topologySpreadConstraints: []
  # Init containers
  initContainers: []
    # - name: name
    #   image: alpine
    #   args: []
    #   volumeMounts:
    #     - name: volume-name
    #       mountPath: /data
  # Additional containers
  additionalContainers: []
    # - name: name
    #   image: alpine
    #   args: []
    #   volumeMounts:
    #     - name: volume-name
    #       mountPath: /data
  # Additional volumes for use with initContainers, additionalContainers and runtime container itself
  additionalVolumes: []
    # - name: name
    #   hostPath:
    #     path: /tmp
    # - name: logging
    #   emptyDir: {}
  # Additional mount points for the runtime container. Refer to volumes defined in `additionalVolumes`.
  additionalVolumeMounts: []
    # - name: logging
    #   mountPath: /var/log/reposilite/
  # Image pull secrets
  imagePullSecrets: []
  lifecycle: {}
    # preStop:
    #   exec:
    #     command: ["/bin/sh", "-c", "sleep 40"]
  # Opt-in shutdown budget. Both values at 0 keep the stop of earlier versions: SIGTERM at once and the grace period
  # above. When either value is above 0, terminationGracePeriodSeconds becomes preStopSeconds + drainSeconds + 10.
  # The values apply to each pod, so a rolling update takes longer by about their sum for every replica.
  shutdown:
    # Seconds of a preStop sleep, so the pod stays in the endpoints while the proxy removes it. Not rendered when
    # `lifecycle` is set, because the operator's own preStop action is kept.
    preStopSeconds: 0
    # Seconds Ingot waits for the requests in flight, as INGOT_SHUTDOWN_TIMEOUT. Not rendered when env sets
    # INGOT_SHUTDOWN_TIMEOUT, because the operator's value is kept.
    drainSeconds: 0
  # Security context for all initContainers and containers in the pod.
  # Disabled by default: the server starts as root and the entrypoint drops to the service account, so PUID, PGID
  # and the ownership fix of an existing volume keep working. Set runAsUser and runAsGroup only for a volume that
  # is already owned by that user.
  podSecurityContext:
    enabled: false
    fsGroup: 999
  # Security context specific to the runtime container in the pod.
  containerSecurityContext:
    enabled: false
    runAsUser: 999
    runAsGroup: 999
  # Pod Security profile of the server, for clusters that enforce the restricted Pod Security level. "" renders no
  # profile. "restricted" runs the pod as uid and gid 977 and mounts emptyDir volumes at /tmp and /var/log/reposilite.
  # "restricted-openshift" sets the same fields without the fixed ids, for clusters that assign the uid. Do not combine
  # a profile with podSecurityContext.enabled or containerSecurityContext.enabled.
  securityProfile: ""

## Service configuration of the server
service:
  type: ClusterIP
  port: 8080
  annotations: {}

## HorizontalPodAutoscaler configuration. Applies to the server.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

## If you would like to create an ingress for Ingot, you can enable it here.
## In split mode the ingress sends the dashboard paths to the dashboard Service and everything else to the server.
## The per-host `paths` are not used in split mode.
## Please refer to your ingress provider's documentation for configuration that may be specific
## to their ingress implementation.
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: reposilite.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

## Gateway API route, as an alternative to the ingress. Enabling both is rejected at render time.
## In split mode the rules match the same paths as the ingress.
httpRoute:
  enabled: false
  # Gateways the route attaches to, for example: [{name: public-gateway, namespace: gateway-system}]
  parentRefs: []
  # Host names the route answers for. Empty matches every host.
  hostnames: []

## PodDisruptionBudget for the server, and for the dashboard in split mode.
## Enabled budgets set maxUnavailable to 1, because minAvailable 1 on a single replica blocks every node drain.
podDisruptionBudget:
  enabled: false

## Prometheus Operator ServiceMonitor for the server. Needs the monitoring.coreos.com CRDs.
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  labels: {}
  # Basic auth for the scrape. The Prometheus plugin answers 401 without it. The plugin is not part of the image:
  # build it, add it to the plugins directory, and set REPOSILITE_PROMETHEUS_USER and REPOSILITE_PROMETHEUS_PASSWORD
  # on the server with the same credentials as the Secret below (env or envFrom).
  basicAuth:
    enabled: false
    # Name of a Secret in the release namespace that holds both credentials.
    secretName: ""
    usernameKey: username
    passwordKey: password

## Opt-in PrometheusRule with the base alerts of the server: availability, error ratio, unreachable upstreams, rejected
## deploys, heap pressure and the cluster bus. Needs the monitoring.coreos.com CRDs. The alerts read the metrics of the
## bundled Prometheus plugin, so the server must run with INGOT_METRICS_ENABLED=true and the plugin credentials.
prometheusRule:
  enabled: false
  # Extra labels on the PrometheusRule, for example the label that your Prometheus instance selects its rules with.
  labels: {}

## Opt-in Grafana dashboards for the server: overview, mirroring and JVM. Each one is a ConfigMap labelled
## grafana_dashboard: "1" for the Grafana sidecar. The same JSON files are in files/dashboards of the chart.
grafanaDashboards:
  enabled: false

## Resources
resources:
  requests:
    cpu: 1.0
    memory: 128Mi
  limits:
    cpu: 2.0
    memory: 256Mi

## Environment variables of the server
env:
  - name: JAVA_OPTS
    value: "-Xmx64M"
#  - name: REPOSILITE_OPTS
#    value: "--port 8080"
#  - name: SOME_VAR_FROM_CONFIG_MAP
#    valueFrom:
#      configMapRef:
#        name: config-name
#        key: config-key
#  - name: SOME_VAR_FROM_SECRET
#    valueFrom:
#      secretKeyRef:
#        name: secret-name
#        key: secret-key

## Environment variables from
envFrom: []
# - configMapRef:
#     name: config-map-name
# - secretRef:
#     name: secret-name

## Opt-in JVM options of the server. Nothing is rendered unless a key is set. The flags go into JDK_JAVA_OPTIONS, which the
## JVM reads before JAVA_OPTS. An explicit -Xmx in JAVA_OPTS overrides maxRAMPercentage, and the chart does not remove it.
## An option that env already sets in JDK_JAVA_OPTIONS fails the render, so the chart never guesses which value wins.
jvm:
  # Maximum heap as a percentage of the container memory limit, as -XX:MaxRAMPercentage. Empty renders nothing.
  maxRAMPercentage: ""
  # Initial heap as a percentage of the container memory limit, as -XX:InitialRAMPercentage. Empty renders nothing.
  initialRAMPercentage: ""
  # Garbage collector as a HotSpot name without the prefix, for example UseG1GC or UseSerialGC. Rendered as -XX:+<name>.
  gc: ""
  # Processors the JVM assumes, as -XX:ActiveProcessorCount. Empty renders nothing.
  activeProcessorCount: ""
  # Further JVM options, appended unchanged to JDK_JAVA_OPTIONS.
  extraOptions: []

## Opt-in OpenTelemetry Java agent of the server. The init container copies the agent jar into an emptyDir, which the server
## mounts read-only at /otel, and the agent flag goes into JDK_JAVA_OPTIONS. The dashboard gets no agent. The image must
## carry the agent at /javaagent.jar and a shell with cp. Set the exporter variables here, not in env, because env values
## that the chart also sets fail the render.
opentelemetry:
  enabled: false
  # Image of the init container. Pinned by tag, which Renovate updates as it does for the other images.
  agentImage: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.30.0
  # Sets OTEL_SERVICE_NAME. Empty uses the release fullname.
  serviceName: ""
  # Sets OTEL_EXPORTER_OTLP_ENDPOINT. Empty leaves the endpoint of the agent unchanged.
  endpoint: ""
  # Sets OTEL_EXPORTER_OTLP_PROTOCOL.
  protocol: grpc
  # Sets OTEL_TRACES_EXPORTER and OTEL_METRICS_EXPORTER.
  tracesExporter: otlp
  metricsExporter: otlp
  # Sets OTEL_LOGS_EXPORTER. Logs stay off by default, because the console output is usually shipped already.
  logsExporter: none
  # Resources of the init container.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

## Opt-in shared settings file of the server. The file is mounted read-only as a directory at /app/shared-config, and the
## server reads it with --shared-configuration and reloads it (INGOT_SHARED_CONFIGURATION_RELOAD=true). Set exactly one
## source. `content` renders a ConfigMap owned by the release, and a change to it restarts the pods. `existingConfigMap`
## names a ConfigMap you manage: the chart does not restart the pods, and the reload applies a change. Both need the key
## configuration.shared.json. The mount is read-only, and the reload makes the server answer 409 to a save of a domain that
## the file holds, so the dashboard never writes into it.
sharedConfiguration:
  enabled: false
  # The JSON document of the shared settings, as text. Rendered as a ConfigMap named <release fullname>-shared-configuration.
  content: ""
  # Name of a ConfigMap in the release namespace with the key configuration.shared.json.
  existingConfigMap: ""

## Rolling update
rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

## Readiness and liveness probes of the server.
## `path` is used in allInOne mode. In split mode the server is probed on `serverPath`, because the server root is not a
## page of the server there.
probes:
  port: 8080  # The port Ingot is running on inside the pod.
  scheme: "HTTP"  # Scheme to use in GET requests.
  path: "/"
  serverPath: "/api/status/health"
  # Path of the readiness probe. Empty uses `path` in allInOne mode and /api/status/ready in split mode. Liveness is not
  # affected. Split readiness needs an image that ships /api/status/ready, see the split how-to.
  readinessPath: ""
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 1
  # Readiness of the split server. Used instead of `readiness` in split mode. The readiness check of Ingot runs a database
  # query and a storage listing, so one slow answer must not take the pod out of rotation.
  split:
    readiness:
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 2
  liveness:
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 2
    successThreshold: 1
    failureThreshold: 3
  # Startup probe of the server. `enabled` is unset by default, which means on in split mode and off in allInOne mode.
  # Set it to true or false to choose. Liveness is held back until the startup probe succeeds, so a first start that takes
  # longer than the liveness budget is not restarted. The budget is periodSeconds * failureThreshold.
  startup:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30

## Persistent Volume Claim of the server
## Ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
## RECOMMENDED: This is required to persist configuration changes and artifacts!
persistence:
  enabled: true
  name: "data"
  size: 4Gi
# storageClass: "" # Use this if you wish to define a StorageClass to use.
  accessMode: ReadWriteOnce
  annotations: {}
# existingClaim: "" # Use this if you already have an existing PVC for Ingot.
  path: /app/data
# subPath: "" # Only mount a subdirectory of the Volume to the pod.

## Service account, shared by the server and the dashboard
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  automountServiceAccountToken: false

## Pod affinity of the server
affinity: {}

## Pod node selector of the server
nodeSelector: {}

## Pod tolerations of the server
tolerations: []

## The dashboard workload. Rendered in split mode only.
## The defaults are the hardened ones: UID 65532, a read-only root filesystem, all capabilities dropped and no
## privilege escalation. The image writes nothing at run time, so it needs no writable volume.
dashboard:
  image:
    name: ghcr.io/onelitefeathernet/ingot-dashboard
    tag: ""  # defaults to appVersion
    pullPolicy: IfNotPresent
  # Number of replicas of the dashboard
  replicas: 1
  # Time in seconds before Kubernetes sends a SIGKILL signal
  terminationGracePeriodSeconds: 30
  annotations: {}
  labels: {}
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []
  # Additional environment variables of the dashboard. INGOT_BACKEND is set by the chart.
  env: []
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  probes:
    scheme: "HTTP"
    path: "/healthz"
    readiness:
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 2
      successThreshold: 1
      failureThreshold: 3
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  affinity: {}
  nodeSelector: {}
  tolerations: []
  # Topology spread constraints of the dashboard pods, passed through unchanged. Empty renders no field.
  topologySpreadConstraints: []
