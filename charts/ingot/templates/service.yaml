apiVersion: v1
kind: Service
metadata:
  name: {{ include "ingot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
  {{- with .Values.service.annotations  }}
    {{ toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "ingot.labels" . | nindent 4 }}
    {{- if eq .Values.mode "split" }}
    app.kubernetes.io/component: server
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ingot.selectorLabels" . | nindent 4 }}
    {{- if eq .Values.mode "split" }}
    app.kubernetes.io/component: server
    {{- end }}
