{{- if and .Values.ingress.enabled .Values.httpRoute.enabled }}
{{- fail "ingress.enabled and httpRoute.enabled cannot both be true: enable one routing form, either ingress or httpRoute" }}
{{- end }}
{{- if .Values.ingress.enabled -}}
{{- $fullName := include "ingot.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $dashboardName := include "ingot.dashboardFullname" . -}}
{{- $dashboardPort := .Values.dashboard.service.port -}}
{{- $segments := .Files.Get "files/dashboard-segments.json" | fromJsonArray -}}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className}}
  {{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if eq $.Values.mode "split" }}
          {{- include "ingot.ingressPath" (dict "path" "/" "pathType" "Exact" "service" $dashboardName "port" $dashboardPort) | nindent 10 }}
          {{- include "ingot.ingressPath" (dict "path" "/assets" "pathType" "Prefix" "service" $dashboardName "port" $dashboardPort) | nindent 10 }}
          {{- include "ingot.ingressPath" (dict "path" "/favicon.png" "pathType" "Exact" "service" $dashboardName "port" $dashboardPort) | nindent 10 }}
          {{- range $segment := $segments }}
          {{- include "ingot.ingressPath" (dict "path" (printf "/%s" $segment) "pathType" "Prefix" "service" $dashboardName "port" $dashboardPort) | nindent 10 }}
          {{- end }}
          {{- include "ingot.ingressPath" (dict "path" "/" "pathType" "Prefix" "service" $fullName "port" $svcPort) | nindent 10 }}
          {{- else }}
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and .pathType (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
