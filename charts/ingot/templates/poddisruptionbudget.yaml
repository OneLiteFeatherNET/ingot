{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ingot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingot.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ingot.selectorLabels" . | nindent 6 }}
{{- if eq .Values.mode "split" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ingot.dashboardFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingot.dashboardLabels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ingot.dashboardSelectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
