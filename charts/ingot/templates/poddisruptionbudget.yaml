{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ingot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingot.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ingot.selectorLabels" . | nindent 6 }}
      {{- if eq .Values.mode "split" }}
      app.kubernetes.io/component: server
      {{- end }}
{{- if eq .Values.mode "split" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ingot.dashboardFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingot.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ingot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
{{- end }}
{{- end }}
