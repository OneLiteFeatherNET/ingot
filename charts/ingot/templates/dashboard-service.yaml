{{- if eq .Values.mode "split" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ingot.dashboardFullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.dashboard.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "ingot.dashboardLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ingot.dashboardSelectorLabels" . | nindent 4 }}
{{- end }}
