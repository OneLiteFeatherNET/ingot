{{- if .Values.httpRoute.enabled }}
{{- $fullName := include "ingot.fullname" . -}}
{{- $dashboardName := include "ingot.dashboardFullname" . -}}
{{- $segments := .Files.Get "files/dashboard-segments.json" | fromJsonArray -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingot.labels" . | nindent 4 }}
spec:
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if eq .Values.mode "split" }}
    - matches:
        - path: {type: Exact, value: "/"}
        - path: {type: PathPrefix, value: "/assets"}
        - path: {type: Exact, value: "/favicon.png"}
        {{- range $segment := $segments }}
        - path: {type: PathPrefix, value: {{ printf "/%s" $segment | quote }}}
        {{- end }}
      backendRefs:
        - name: {{ $dashboardName }}
          port: {{ .Values.dashboard.service.port }}
    {{- end }}
    - matches:
        - path: {type: PathPrefix, value: "/"}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.port }}
{{- end }}
