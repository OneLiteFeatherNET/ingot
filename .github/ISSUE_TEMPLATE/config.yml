    url: https://github.com/OneLiteFeatherNET/ingot/discussions
    about: Ask questions and talk to other Ingot users.
  - name: Documentation
    url: https://github.com/OneLiteFeatherNET/ingot/tree/main/docs/gitbook
    about: Installation, configuration and deployment guides.
