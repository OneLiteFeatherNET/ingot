# Builds and tests the project on pull requests and on pushes to main.
name: "CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Baseline build on the minimum supported JDK. The project compiles with
  # sourceCompatibility/targetCompatibility 17, so 17 is what has to keep working.
  build:
    name: "Build"
    # Pull requests only, as the name gradle-build-pr says. Its first job runs
    # dorny/paths-filter without a checkout, which works on pull_request because the action
    # asks the API for the changed files, and fails on push because there it needs a
    # working copy to diff. A failing filter job takes the build with it, since the build
    # job's `if` carries no status function and is therefore implicitly gated on success.
    #
    # Pushes to main are covered by the Coverage job below, which builds and runs the full
    # backend suite. Drop this condition once the shared workflow checks out before
    # filtering.
    if: github.event_name == 'pull_request'
    # gradle-build-pr.yml publishes the JUnit results as a check and a PR comment, so it
    # declares checks: write and pull-requests: write on that job. A called workflow cannot
    # request more than the caller granted, and the repository default here is
    # contents: read, so without this block GitHub rejects the whole run during startup
    # validation rather than failing a job. That is why it reported startup_failure and
    # never produced a single log line.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-build-pr.yml@v2.4.0
    with:
      java-version: "17"
      java-distribution: "temurin"
      # The default 3-OS matrix is narrowed to Linux on purpose: the backend integration
      # tests use Testcontainers, and only the ubuntu runners ship a usable Docker daemon.
      runs-on: '["ubuntu-latest"]'
    secrets: inherit

  # Ingot ships as FOSS, so a dependency whose licence changes under us is a release
  # blocker rather than a footnote. ApexCharts is the case this exists for: same package
  # id, new licence, one Renovate bump. Both halves of the product are checked, because
  # the JVM and npm trees fail in completely different ways.
  licenses:
    name: "Licenses"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Check backend dependency licenses"
        run: ./gradlew :reposilite-backend:checkLicense

      - name: "Set up Node"
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "reposilite-frontend/package-lock.json"

      - name: "Install frontend dependencies"
        working-directory: reposilite-frontend
        run: npm ci

      - name: "Check frontend dependency licenses"
        working-directory: reposilite-frontend
        run: npm run license-check

  # Nothing checked dependencies for known advisories before this, which is how 67 of them
  # accumulated unnoticed across the JVM and npm trees. Renovate raises versions but says
  # nothing about whether the current ones are exploitable, and the licence gate next to
  # this one answers a different question entirely.
  vulnerabilities:
    name: "Vulnerabilities"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      # Trivy reads lockfiles, and a Gradle build without dependency locking has none. The
      # task copies the resolved runtime classpath out so the jars can be identified by
      # checksum instead.
      - name: "Collect the resolved runtime dependencies"
        run: ./gradlew :reposilite-backend:collectRuntimeDependencies

      - name: "Scan the backend dependencies"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: reposilite-backend/build/dependency-jars
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

      - name: "Scan the frontend dependencies"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: reposilite-frontend/package-lock.json
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

      - name: "Scan the documentation site dependencies"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: reposilite-site/package-lock.json
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

  # Both images were only ever built while cutting a release, so a broken Dockerfile would
  # surface at the worst possible moment, with a tag already pushed. Building them here
  # costs a few minutes and moves that discovery to the pull request that caused it.
  #
  # Nothing is pushed. This answers "does it build", which is the failure mode that used to
  # escape; the release job stays the only thing that publishes.
  images:
    name: "Container images"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      # For the arm64 leg further down. Only the run stages are emulated; the Gradle and npm
      # builds are pinned to the native platform in the Dockerfiles.
      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: "Set up Buildx"
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # Built for the host architecture and loaded, because the checks below run it. The
      # other published architecture is covered by its own step at the end.
      - name: "Build the server image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ingot:ci
          cache-from: type=gha,scope=ci-server
          cache-to: type=gha,mode=max,scope=ci-server

      - name: "Build the dashboard image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          # The repository root, not the module: the image needs branding assets from
          # outside reposilite-frontend.
          context: .
          file: reposilite-frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ingot-dashboard:ci
          cache-from: type=gha,scope=ci-dashboard
          cache-to: type=gha,mode=max,scope=ci-dashboard

      # Building an image proves the Dockerfile parses. Everything that has actually gone
      # wrong with these two was runtime behaviour that a build cannot see: privileges the
      # entrypoint could no longer drop, an environment variable read and ignored, a log
      # directory that stayed empty, an nginx serving no server block.
      #
      # The suite lives in reposilite-backend/src/containerTest and runs both images the way
      # a deployment does, including an upgrade rehearsal against the real upstream image.
      # It is a suite of its own because it needs an image that already exists, which is why
      # it cannot be part of the normal build.
      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Run the container tests"
        run: ./gradlew :reposilite-backend:containerTest

      - name: "Publish the container test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-test-results
          path: reposilite-backend/build/reports/tests/containerTest
          retention-days: 7
          if-no-files-found: ignore

      # The vulnerabilities job next to this one scans the Gradle and npm trees, which says
      # nothing about the base image underneath them. That is where an unpatched openssl or
      # zlib would sit, and it is the half that is shipped without anyone here declaring it.
      #
      # Only fixable findings fail the build. An advisory with no released fix cannot be
      # acted on by bumping anything, so failing on it would train everyone to ignore this
      # step; those are caught by the Renovate base image bumps instead.
      - name: "Scan the server image"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ingot:ci
          scanners: vuln,secret
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: "Scan the dashboard image"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ingot-dashboard:ci
          scanners: vuln,secret
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

      # Both images are published for linux/arm64 as well, and the run stages are the part
      # that is genuinely built per architecture: creating the service account, copying
      # files, rendering an nginx config. Emulated, those are seconds, because the Gradle
      # and npm work is pinned to the native platform and is already in the cache from the
      # steps above. The alternative is finding out at release time.
      #
      # Neither loaded nor pushed: a single Docker image store cannot hold two
      # architectures under one tag, and the question here is only whether it builds.
      - name: "Build the server image for arm64"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=ci-server
          cache-to: type=gha,mode=max,scope=ci-server-arm64

      - name: "Build the dashboard image for arm64"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: reposilite-frontend/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=ci-dashboard
          cache-to: type=gha,mode=max,scope=ci-dashboard-arm64

  # Second JDK leg, combined with the JaCoCo report so the test suite is not run three times.
  # This job is intentionally repo-specific: the shared gradle-build-pr workflow has no
  # coverage upload, and the Codecov integration is a Reposilite-only mechanic.
  coverage:
    name: "Coverage"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6
        with:
          # Full history so Codecov can attribute coverage to the right commits. The build
          # itself no longer needs tags: the version is a literal in build.gradle.kts.
          fetch-depth: 0

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Run tests with coverage"
        run: ./gradlew :reposilite-backend:testCoverage

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6.0.2
        with:
          files: "./reposilite-backend/build/reports/jacoco/reposilite-backend-report.xml"
          fail_ci_if_error: false
          # Tokenless uploads are rate limited. Set CODECOV_TOKEN in the repository secrets,
          # or drop this input together with codecov.yml if coverage reporting is not wanted.
          token: ${{ secrets.CODECOV_TOKEN }}
