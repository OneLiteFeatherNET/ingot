# Builds and tests the project on pull requests and on pushes to main.
name: "CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Baseline build on the minimum supported JDK. The project compiles with
  # sourceCompatibility/targetCompatibility 17, so 17 is what has to keep working.
  build:
    name: "Build"
    # Pull requests only, as the name gradle-build-pr says. Its first job runs
    # dorny/paths-filter without a checkout, which works on pull_request because the action
    # asks the API for the changed files, and fails on push because there it needs a
    # working copy to diff. A failing filter job takes the build with it, since the build
    # job's `if` carries no status function and is therefore implicitly gated on success.
    #
    # Pushes to main are covered by the Coverage job below, which builds and runs the full
    # backend suite. Drop this condition once the shared workflow checks out before
    # filtering.
    if: github.event_name == 'pull_request'
    # gradle-build-pr.yml publishes the JUnit results as a check and a PR comment, so it
    # declares checks: write and pull-requests: write on that job. A called workflow cannot
    # request more than the caller granted, and the repository default here is
    # contents: read, so without this block GitHub rejects the whole run during startup
    # validation rather than failing a job. That is why it reported startup_failure and
    # never produced a single log line.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-build-pr.yml@v2.4.0
    with:
      java-version: "17"
      java-distribution: "temurin"
      # The default 3-OS matrix is narrowed to Linux on purpose: the backend integration
      # tests use Testcontainers, and only the ubuntu runners ship a usable Docker daemon.
      runs-on: '["ubuntu-latest"]'
    secrets: inherit

  # Ingot ships as FOSS, so a dependency whose licence changes under us is a release
  # blocker rather than a footnote. ApexCharts is the case this exists for: same package
  # id, new licence, one Renovate bump. Both halves of the product are checked, because
  # the JVM and npm trees fail in completely different ways.
  licenses:
    name: "Licenses"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Check backend dependency licenses"
        run: ./gradlew :reposilite-backend:checkLicense

      - name: "Set up Node"
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "reposilite-frontend/package-lock.json"

      - name: "Install frontend dependencies"
        working-directory: reposilite-frontend
        run: npm ci

      - name: "Check frontend dependency licenses"
        working-directory: reposilite-frontend
        run: npm run license-check

  # Nothing checked dependencies for known advisories before this, which is how 67 of them
  # accumulated unnoticed across the JVM and npm trees. Renovate raises versions but says
  # nothing about whether the current ones are exploitable, and the licence gate next to
  # this one answers a different question entirely.
  vulnerabilities:
    name: "Vulnerabilities"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      # Trivy reads lockfiles, and a Gradle build without dependency locking has none. The
      # task copies the resolved runtime classpath out so the jars can be identified by
      # checksum instead.
      - name: "Collect the resolved runtime dependencies"
        run: ./gradlew :reposilite-backend:collectRuntimeDependencies

      - name: "Scan the backend dependencies"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: reposilite-backend/build/dependency-jars
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

      - name: "Scan the frontend dependencies"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: reposilite-frontend/package-lock.json
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

      - name: "Scan the documentation site dependencies"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: reposilite-site/package-lock.json
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

  # Second JDK leg, combined with the JaCoCo report so the test suite is not run three times.
  # This job is intentionally repo-specific: the shared gradle-build-pr workflow has no
  # coverage upload, and the Codecov integration is a Reposilite-only mechanic.
  coverage:
    name: "Coverage"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6
        with:
          # Full history so Codecov can attribute coverage to the right commits. The build
          # itself no longer needs tags: the version is a literal in build.gradle.kts.
          fetch-depth: 0

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Run tests with coverage"
        run: ./gradlew :reposilite-backend:testCoverage

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6.0.2
        with:
          files: "./reposilite-backend/build/reports/jacoco/reposilite-backend-report.xml"
          fail_ci_if_error: false
          # Tokenless uploads are rate limited. Set CODECOV_TOKEN in the repository secrets,
          # or drop this input together with codecov.yml if coverage reporting is not wanted.
          token: ${{ secrets.CODECOV_TOKEN }}
