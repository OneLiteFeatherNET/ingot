# Builds and tests the project on pull requests and on pushes to main.
name: "CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Baseline build on the minimum supported JDK. The project compiles with
  # sourceCompatibility/targetCompatibility 17, so 17 is what has to keep working.
  build:
    name: "Build"
    # Pull requests only, as the name gradle-build-pr says. Its first job runs
    # dorny/paths-filter without a checkout, which works on pull_request because the action
    # asks the API for the changed files, and fails on push because there it needs a
    # working copy to diff. A failing filter job takes the build with it, since the build
    # job's `if` carries no status function and is therefore implicitly gated on success.
    #
    # Pushes to main are covered by the Coverage job below, which builds and runs the full
    # backend suite. Drop this condition once the shared workflow checks out before
    # filtering.
    if: github.event_name == 'pull_request'
    # gradle-build-pr.yml publishes the JUnit results as a check and a PR comment, so it
    # declares checks: write and pull-requests: write on that job. A called workflow cannot
    # request more than the caller granted, and the repository default here is
    # contents: read, so without this block GitHub rejects the whole run during startup
    # validation rather than failing a job. That is why it reported startup_failure and
    # never produced a single log line.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-build-pr.yml@6eca5b5d8612ab1aac0f0f25248cd44ff9594886  # v2.4.0
    with:
      java-version: "17"
      java-distribution: "temurin"
      # The default 3-OS matrix is narrowed to Linux on purpose: the backend integration
      # tests use Testcontainers, and only the ubuntu runners ship a usable Docker daemon.
      runs-on: '["ubuntu-latest"]'
    secrets: inherit

  # Ingot ships as FOSS, so a dependency whose licence changes under us is a release
  # blocker rather than a footnote. ApexCharts is the case this exists for: same package
  # id, new licence, one Renovate bump. Both halves of the product are checked, because
  # the JVM and npm trees fail in completely different ways.
  licenses:
    name: "Licenses"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Set up Java"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Check backend dependency licenses"
        run: ./gradlew :reposilite-backend:checkLicense

      - name: "Set up Node"
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "reposilite-frontend/package-lock.json"

      - name: "Install frontend dependencies"
        working-directory: reposilite-frontend
        run: npm ci

      # Checks the registry signatures and provenance attestations of what npm ci installed.
      # The lockfile hashes only prove the bytes did not change since the lockfile was written.
      - name: "Verify frontend package signatures"
        working-directory: reposilite-frontend
        run: npm audit signatures

      - name: "Check frontend dependency licenses"
        working-directory: reposilite-frontend
        run: npm run license-check

  # Own job rather than steps in Licenses, so a failing unit test shows as its own check and
  # does not hide the licence result. ESLint is in its warn phase: findings are printed in the
  # log and only a broken configuration fails the job.
  frontend:
    name: "Frontend"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: "Set up Node"
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "reposilite-frontend/package-lock.json"

      - name: "Install frontend dependencies"
        working-directory: reposilite-frontend
        run: npm ci

      - name: "Lint the frontend"
        working-directory: reposilite-frontend
        run: npm run eslint

      - name: "Run the frontend unit tests"
        working-directory: reposilite-frontend
        run: npm test

  # Nothing checked dependencies for known advisories before this, which is how 67 of them
  # accumulated unnoticed across the JVM and npm trees. Renovate raises versions but says
  # nothing about whether the current ones are exploitable, and the licence gate next to
  # this one answers a different question entirely.
  vulnerabilities:
    name: "Vulnerabilities"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Set up Java"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      # Trivy reads lockfiles, and a Gradle build without dependency locking has none. The
      # task copies the resolved runtime classpath out so the jars can be identified by
      # checksum instead.
      - name: "Collect the resolved runtime dependencies"
        run: ./gradlew :reposilite-backend:collectRuntimeDependencies

      - name: "Scan the backend dependencies"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: reposilite-backend/build/dependency-jars
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

      - name: "Scan the frontend dependencies"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: reposilite-frontend/package-lock.json
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

  # Both images were only ever built while cutting a release, so a broken Dockerfile would
  # surface at the worst possible moment, with a tag already pushed. Building them here
  # costs a few minutes and moves that discovery to the pull request that caused it.
  #
  # Nothing is pushed. This answers "does it build", which is the failure mode that used to
  # escape; the release job stays the only thing that publishes.
  images:
    name: "Container images"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      # For the arm64 leg further down. Only the run stages are emulated; the Gradle and npm
      # builds are pinned to the native platform in the Dockerfiles.
      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: "Set up Buildx"
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # The annotation check that the release job runs on pushed images. Its tests use
      # fixture files only, so they need neither a registry nor the Docker daemon.
      - name: "Run the image annotation check tests"
        run: python3 -m unittest discover -s .github/scripts/tests -t .github/scripts/tests -v

      # Built for the host architecture and loaded, because the checks below run it. The
      # other published architecture is covered by its own step at the end.
      - name: "Build the server image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ingot:ci
          cache-from: type=gha,scope=ci-server
          cache-to: type=gha,mode=max,scope=ci-server

      - name: "Build the dashboard image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          # The repository root, not the module: the image needs branding assets from
          # outside reposilite-frontend.
          context: .
          file: reposilite-frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ingot-dashboard:ci
          cache-from: type=gha,scope=ci-dashboard
          cache-to: type=gha,mode=max,scope=ci-dashboard

      # Building an image proves the Dockerfile parses. Everything that has actually gone
      # wrong with these two was runtime behaviour that a build cannot see: privileges the
      # entrypoint could no longer drop, an environment variable read and ignored, a log
      # directory that stayed empty, an nginx serving no server block.
      #
      # The suite lives in reposilite-backend/src/containerTest and runs both images the way
      # a deployment does, including an upgrade rehearsal against the real upstream image,
      # two replicas that find each other through a NATS broker on one MariaDB database, and
      # the previous release running beside the new image on that database.
      # It is a suite of its own because it needs an image that already exists, which is why
      # it cannot be part of the normal build.
      - name: "Set up Java"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      # The previous release is the highest version tag, so the mixed-version case always pairs the current build with the
      # release an operator upgrades from. This checkout is shallow and fetches no tags, so the tags are read from the remote.
      - name: "Resolve the latest release"
        id: previous
        run: |
          tag=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/##' | sort -V | tail -n 1)
          test -n "$tag"
          echo "Previous release: $tag"
          echo "image=ghcr.io/onelitefeathernet/ingot:${tag#v}" >> "$GITHUB_OUTPUT"

      - name: "Run the container tests"
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: ./gradlew :reposilite-backend:containerTest -Dingot.previous.image="$PREVIOUS_IMAGE"

      - name: "Publish the container test results"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: container-test-results
          path: reposilite-backend/build/reports/tests/containerTest
          retention-days: 7
          if-no-files-found: ignore

      # The vulnerabilities job next to this one scans the Gradle and npm trees, which says
      # nothing about the base image underneath them. That is where an unpatched openssl or
      # zlib would sit, and it is the half that is shipped without anyone here declaring it.
      #
      # Only fixable findings fail the build. An advisory with no released fix cannot be
      # acted on by bumping anything, so failing on it would train everyone to ignore this
      # step; those are caught by the Renovate base image bumps instead.
      - name: "Scan the server image"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ingot:ci
          scanners: vuln,secret
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: "Scan the dashboard image"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ingot-dashboard:ci
          scanners: vuln,secret
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

      # Both images are published for linux/arm64 as well, and the run stages are the part
      # that is genuinely built per architecture: creating the service account, copying
      # files, rendering an nginx config. Emulated, those are seconds, because the Gradle
      # and npm work is pinned to the native platform and is already in the cache from the
      # steps above. The alternative is finding out at release time.
      #
      # Neither loaded nor pushed: a single Docker image store cannot hold two
      # architectures under one tag, and the question here is only whether it builds.
      - name: "Build the server image for arm64"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=ci-server
          cache-to: type=gha,mode=max,scope=ci-server-arm64

      - name: "Build the dashboard image for arm64"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: reposilite-frontend/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=ci-dashboard
          cache-to: type=gha,mode=max,scope=ci-dashboard-arm64

  # The chart is linted and rendered without a cluster first, because a broken template is the
  # cheapest thing to catch. Then chart-testing installs both deploy modes on a kind cluster
  # with the images this commit builds, so the probes and the wiring are exercised for real.
  #
  # The cmp is the drift check of the dashboard segment list: the chart carries a copy of the
  # source that the frontend router and the backend read, and an edit of one without the other
  # fails here.
  chart:
    name: "Helm chart"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: "Set up Helm"
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v4.3.0

      - name: "Set up Python"
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"

      - name: "Install the chart test dependencies"
        run: python3 -m pip install "pyyaml==6.0.3"

      - name: "Install promtool"
        # Prometheus 3.5.0 release archive, verified against the sha256 published with the release.
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/prometheus.tar.gz" \
            https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          echo "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a  $RUNNER_TEMP/prometheus.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file "$RUNNER_TEMP/prometheus.tar.gz" --directory "$RUNNER_TEMP" prometheus-3.5.0.linux-amd64/promtool
          echo "PROMTOOL=$RUNNER_TEMP/prometheus-3.5.0.linux-amd64/promtool" >> "$GITHUB_ENV"

      - name: "Lint the chart in both deploy modes"
        run: |
          helm lint charts/ingot --strict -f charts/ingot/ci/allinone-values.yaml
          helm lint charts/ingot --strict -f charts/ingot/ci/split-values.yaml

      - name: "Check the alert rules with promtool"
        run: |
          helm template ingot charts/ingot --namespace reposilite-staging --set prometheusRule.enabled=true \
            --show-only templates/prometheusrule.yaml > "$RUNNER_TEMP/prometheusrule.yaml"
          python3 -c 'import sys, yaml; print(yaml.safe_dump(yaml.safe_load(open(sys.argv[1]))["spec"]))' \
            "$RUNNER_TEMP/prometheusrule.yaml" > "$RUNNER_TEMP/rules.yaml"
          "$PROMTOOL" check rules "$RUNNER_TEMP/rules.yaml"

      - name: "Run the chart tests"
        run: python3 -m unittest discover -s charts/ingot/tests -t charts/ingot/tests -v

      - name: "Check the dashboard segment copy against its source"
        run: cmp charts/ingot/files/dashboard-segments.json reposilite-frontend/src/router/dashboard-segments.json

      - name: "Set up chart-testing"
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0
        with:
          version: "3.14.0"

      - name: "Lint the chart with chart-testing"
        run: ct lint --config ct.yaml --all

      - name: "Set up kind"
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa  # v1.15.1
        with:
          cluster_name: ingot

      - name: "Set up Buildx"
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # Built for the host architecture and loaded into the local image store, so kind can take
      # them from there. The tags are the ones the ci values files of the chart name.
      - name: "Build the server image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ingot:ci
          cache-from: type=gha,scope=ci-server

      - name: "Build the dashboard image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: reposilite-frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ingot-dashboard:ci
          cache-from: type=gha,scope=ci-dashboard

      - name: "Load the images into kind"
        run: kind load docker-image ingot:ci ingot-dashboard:ci --name ingot

      # Installs each ci/*-values.yaml of the chart in turn, with the readiness and liveness probes
      # of both workloads, and waits until the pods are ready.
      - name: "Install the chart in both deploy modes"
        run: ct install --config ct.yaml --all

      # The restricted profile is installed into a namespace that enforces the Pod Security
      # restricted level, so the API server rejects the pod unless the render meets that level.
      # The Deployment is available only when its pod is ready, and the pod wait checks it again.
      - name: "Install the restricted profile into a restricted namespace"
        run: |
          kubectl create namespace ingot-restricted
          kubectl label namespace ingot-restricted pod-security.kubernetes.io/enforce=restricted
          helm install ingot-restricted charts/ingot --namespace ingot-restricted \
            -f charts/ingot/ci/allinone-values.yaml --set deployment.securityProfile=restricted
          kubectl -n ingot-restricted wait --for=condition=available deployment/ingot-restricted --timeout=300s
          kubectl -n ingot-restricted wait --for=condition=Ready pod -l app.kubernetes.io/instance=ingot-restricted --timeout=300s

      # Runs the server image the way the restricted pod runs it, outside Kubernetes: a read-only
      # root filesystem, uid 977, every capability dropped and no privilege escalation. The three
      # writable paths are tmpfs mounts, as the emptyDir volumes and the data claim are in the pod.
      - name: "Check the server answers health as uid 977 on a read-only root"
        run: |
          docker run --detach --name ingot-readonly \
            --read-only --user 977:977 --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:exec,mode=1777 --tmpfs /var/log/reposilite:uid=977,gid=977 --tmpfs /app/data:uid=977,gid=977 \
            --publish 127.0.0.1:8080:8080 ingot:ci
          status=000
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/status/health || true)
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 2
          done
          if [ "$status" != "200" ]; then
            echo "The health endpoint answered $status, expected 200"
            docker logs ingot-readonly
            exit 1
          fi

      - name: "Remove the read-only container"
        if: always()
        run: docker rm --force ingot-readonly

  # Two server replicas on one MariaDB server, one Floci bucket and one NATS broker, on their own kind cluster.
  # The dependencies come from charts/ingot/tests/ha/dependencies.yaml and the replicas from the CI values of the
  # same directory. chart-testing never installs those values, so the chart job above is unaffected by them.
  # The driver runs five checks: a rolling restart without a failed read, the takeover of a killed cleanup run,
  # two deploys at the same moment, a refresh token moved between replicas, and both replicas listing both instances.
  ha-smoke:
    name: "HA smoke test"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: "Set up Helm"
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v4.3.0

      - name: "Set up Python"
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"

      - name: "Set up Buildx"
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # The same images and cache scopes as the chart job, built for the host architecture and loaded into the local
      # image store, so that kind can take them from there.
      - name: "Build the server image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ingot:ci
          cache-from: type=gha,scope=ci-server

      - name: "Build the dashboard image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: reposilite-frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ingot-dashboard:ci
          cache-from: type=gha,scope=ci-dashboard

      - name: "Set up kind"
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa  # v1.15.1
        with:
          cluster_name: ingot-ha

      - name: "Load the images into kind"
        run: kind load docker-image ingot:ci ingot-dashboard:ci --name ingot-ha

      # Applies the dependencies, installs the replicas, and runs the five checks. A failed check prints the pod
      # state, the events and the logs of every replica and dependency before the step fails.
      - name: "Run the two-replica smoke test"
        run: python3 charts/ingot/tests/ha_smoke.py

  # Second JDK leg, combined with the JaCoCo report so the test suite is not run three times.
  # This job is intentionally repo-specific: the shared gradle-build-pr workflow has no
  # coverage upload, and the Codecov integration is a Reposilite-only mechanic.
  coverage:
    name: "Coverage"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          # Full history so Codecov can attribute coverage to the right commits. The build
          # itself no longer needs tags: the version is a literal in build.gradle.kts.
          fetch-depth: 0

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Set up Java"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Run tests with coverage"
        run: ./gradlew :reposilite-backend:testCoverage

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6.0.2
        with:
          files: "./reposilite-backend/build/reports/jacoco/reposilite-backend-report.xml"
          fail_ci_if_error: false
          # Tokenless uploads are rate limited. Set CODECOV_TOKEN in the repository secrets,
          # or drop this input together with codecov.yml if coverage reporting is not wanted.
          token: ${{ secrets.CODECOV_TOKEN }}

  # A plugin written for Reposilite 3.5.28 has to keep running on Ingot, and nothing else checks that. The job compares
  # the plugin API with 3.5.28, starts a fresh server with the upstream jars of two bundled plugins, and compiles and
  # tests the bundled plugins, whose sources are the 3.5.28 sources today.
  #
  # Report only: a finding in the binary report and a failing canary do not fail this job. The gate becomes blocking in
  # a later change, once the first report has been triaged. The bundled plugin tests are ordinary tests and still do.
  plugin-api:
    name: "Plugin API"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          # The base commit has to be present for the diff of the bundled plugin sources further down.
          fetch-depth: 0

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Set up Java"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Compare the plugin API with Reposilite 3.5.28"
        run: ./gradlew :reposilite-backend:pluginApiReport

      - name: "Run the upstream plugin canaries"
        id: canaries
        continue-on-error: true
        run: ./gradlew :reposilite-backend:integration --tests '*UpstreamPluginCanary*'

      - name: "Test the bundled plugins"
        run: ./gradlew :reposilite-plugins:checksum-plugin:test :reposilite-plugins:migration-plugin:test

      - name: "Write the results to the job summary"
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANARY_OUTCOME: ${{ steps.canaries.outcome }}
        run: |
          {
            echo "## Plugin API"
            echo
            if [ -f reposilite-backend/build/reports/plugin-api/report.md ]; then
              cat reposilite-backend/build/reports/plugin-api/report.md
            else
              echo "The binary report was not produced. See the job log."
            fi
            echo
            echo "## Upstream plugin canaries"
            echo
            echo "Step outcome: \`${CANARY_OUTCOME}\`. Each canary loads the jar that upstream published for 3.5.28 into a fresh server."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          rows = []
          for path in sorted(glob.glob("reposilite-backend/build/test-results/integration/*UpstreamPluginCanary*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  failed = case.find("failure") is not None or case.find("error") is not None
                  rows.append(f"| {case.get('name')} | {'failed' if failed else 'passed'} |")

          if rows:
              print("| Test | Result |")
              print("| --- | --- |")
              print("\n".join(rows))
          else:
              print("No canary results were produced. See the job log.")
          PY

          changed=$(git diff --name-only "$BASE_SHA" HEAD -- reposilite-plugins/checksum-plugin/src/main reposilite-plugins/migration-plugin/src/main)
          if [ -n "$changed" ]; then
            {
              echo
              echo "## Bundled plugin sources changed"
              echo
              echo "This pull request edits the sources of a bundled plugin. An edit there can hide a break of the plugin API, so read the binary report above closely."
              echo
              echo "$changed" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Publish the HTML report"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: plugin-api-report
          path: reposilite-backend/build/reports/plugin-api/report.html
          retention-days: 7
          if-no-files-found: ignore
