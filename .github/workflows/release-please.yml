# Release automation.
#
# Every push to main lets Release Please open or update the release pull request.
# Merging that pull request tags the release, which in the same run publishes the
# Maven artifacts and the container image. Pushes that do not produce a release
# refresh the rolling nightly container image instead.
name: "Release Please"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      container_version:
        description: "Version to rebuild and push the container image for, e.g. 3.5.29. Runs only the container job."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "release-please-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # The action is called directly rather than through the shared
  # OneLiteFeatherNET/workflows/.github/workflows/release-please.yml wrapper, because the
  # publish jobs below have to read its release_created / version outputs.
  release-please:
    name: "Release Please"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # TODO(onelitefeather): target maven repository. build.gradle.kts still declares
  # `publishing.repositories.maven` with url https://maven.reposilite.com/{releases,snapshots}
  # and reads the MAVEN_NAME / MAVEN_TOKEN environment variables. Point that block at the
  # OneLiteFeather Maven repository and let it read ONELITEFEATHER_MAVEN_USERNAME /
  # ONELITEFEATHER_MAVEN_PASSWORD, which this workflow forwards via `secrets: inherit`.
  # Until that is done this job publishes to the upstream repository, not ours.
  maven:
    name: "Maven"
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-publish.yml@v2.4.0
    with:
      java-version: "21"
      java-distribution: "temurin"
      build-task: ":reposilite-backend:shadowJar"
      publish-task: "publish"
    secrets: inherit

  # Container images go to the GitHub Container Registry. The OneLiteFeather
  # docker-publish reusable targets Harbor and exposes no platforms input, so this is a
  # repository specific job. Publishing to ghcr.io needs no registry secret: the built in
  # GITHUB_TOKEN authenticates via the packages: write permission below.
  container:
    name: "Container image"
    needs: release-please
    if: >-
      always() && !cancelled()
      && (github.event_name == 'workflow_dispatch' || needs.release-please.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The build inside the Dockerfile runs the axion-release-plugin, which needs tags.
          fetch-depth: 0

      - name: "Determine version and platforms"
        id: params
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.container_version }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"; released=true
          elif [ "$RELEASE_CREATED" = "true" ]; then
            version="$RELEASE_VERSION"; released=true
          else
            version="nightly"; released=false
          fi
          # The jar is architecture independent, but the Dockerfile builds it inside the
          # image, so a second architecture means running the whole Gradle build again
          # under QEMU emulation. That cost is worth paying for a release, not for every
          # push to main.
          if [ "$released" = "true" ]; then
            platforms="linux/amd64,linux/arm64"
          else
            platforms="linux/amd64"
          fi
          {
            echo "version=$version"
            echo "released=$released"
            echo "platforms=$platforms"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        if: steps.params.outputs.released == 'true'

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Compute tags and labels"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          # ghcr.io requires a lowercase path; the organisation name is mixed case.
          images: ghcr.io/onelitefeathernet/ingot
          # Floating major and major.minor tags are only meaningful for real releases.
          tags: |
            type=raw,value=${{ steps.params.outputs.version }}
            type=raw,value=latest,enable=${{ steps.params.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.params.outputs.version }},enable=${{ steps.params.outputs.released == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.params.outputs.version }},enable=${{ steps.params.outputs.released == 'true' }}
          labels: |
            org.opencontainers.image.title=Ingot
            org.opencontainers.image.description=Repository management software for Maven artifacts in the JVM ecosystem
            org.opencontainers.image.vendor=OneLiteFeather
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.params.outputs.version }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: ${{ steps.params.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
