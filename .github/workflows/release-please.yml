# Release automation.
#
# Every push to main lets Release Please open or update the release pull request.
# Merging that pull request tags the release, which in the same run publishes the
# Maven artifacts and the container image. Pushes that change something the image
# contains refresh the rolling nightly container image instead.
name: "Release Please"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      container_version:
        description: "Version to rebuild and push the container image for, e.g. 3.5.29. Runs only the container job."
        required: true
        type: string

permissions:
  contents: read

# There is deliberately no workflow level concurrency group. One would serialise every run
# of this workflow, which sounds harmless and is not: a queued nightly still runs its full
# push once the run ahead of it finishes, so a burst of pushes turns into a burst of
# registry writes spread over an hour instead of a single one. The two jobs that actually
# need coordinating declare their own groups, and they need opposite behaviour.

jobs:
  # The action is called directly rather than through the shared
  # OneLiteFeatherNET/workflows/.github/workflows/release-please.yml wrapper, because the
  # publish jobs below have to read its release_created / version outputs.
  release-please:
    name: "Release Please"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Two of these racing would open or update the same release pull request twice.
    # Serialised rather than cancelled: a cancelled run can leave that pull request half
    # written, and the next push would have to repair it.
    concurrency:
      group: "release-please-${{ github.ref }}"
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A push that changes nothing the image contains does not need a new nightly.
  #
  # Before this, every commit on main rebuilt and pushed both images for two architectures.
  # On 2026-08-07 that meant four full nightly pushes between 12:04 and 12:23, all
  # overwriting the same tag, and the next one GHCR refused outright: it answers a throttled
  # manifest PUT with `403 permission_denied` and a secondary rate limit body, which reads
  # like a permissions problem and is not one.
  #
  # Releases are never filtered. This job only decides whether a *nightly* is worth pushing.
  changes:
    name: "Detect image changes"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6
        with:
          # Both ends of the pushed range have to be present for the diff below, and a merge
          # to main can span more commits than any shallow fetch would keep.
          fetch-depth: 0

      - name: "Check whether anything in the image changed"
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A first push, a force push or a rewritten history leaves no usable range.
          # Building is the safe answer there: a nightly built for nothing costs minutes,
          # a nightly silently missing costs somebody an afternoon.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable push range, building anyway."
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A deny list, not an allow list. The Dockerfile copies the whole repository into
          # its build stage, so anything not named here can plausibly reach the image, and
          # guessing wrong in that direction ships a stale nightly rather than a redundant
          # one.
          ignored='^(reposilite-site/|\.github/|\.claude/|LICENSE$|NOTICE$|codecov\.yml$|renovate\.json$|[^/]*\.md$)'

          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          if [ -z "$changed" ]; then
            echo "Nothing changed in this push."
            echo "image=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # grep -v exits 0 as soon as one path is *not* ignored, which is exactly the
          # question being asked.
          if relevant="$(printf '%s\n' "$changed" | grep -vE "$ignored")"; then
            echo "Image relevant changes:"
            printf '%s\n' "$relevant" | sed 's/^/  /'
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only ignored paths changed, skipping the nightly:"
            printf '%s\n' "$changed" | sed 's/^/  /'
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  # Publishes to repo.onelitefeather.dev. The credentials come from
  # ONELITEFEATHER_MAVEN_USERNAME / ONELITEFEATHER_MAVEN_PASSWORD, forwarded by
  # `secrets: inherit` and read in build.gradle.kts.
  maven:
    name: "Maven"
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-publish.yml@v2.4.0
    with:
      java-version: "21"
      java-distribution: "temurin"
      build-task: ":reposilite-backend:shadowJar"
      publish-task: "publish"
    secrets: inherit

  # Attaches the standalone jar to the GitHub release. Without this there is no public
  # download for the jar at all: the Maven job publishes to repo.onelitefeather.dev, which
  # requires credentials even to read, so the standalone installation guide would point at a
  # release page with no artifact on it.
  jar:
    name: "Standalone jar"
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Build the standalone jar"
        run: ./gradlew :reposilite-backend:shadowJar

      - name: "Upload the jar to the release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "reposilite-backend/build/libs/ingot-${VERSION}.jar" --clobber

  # Container images go to the GitHub Container Registry. The OneLiteFeather
  # docker-publish reusable targets Harbor and exposes no platforms input, so this is a
  # repository specific job. Publishing to ghcr.io needs no registry secret: the built in
  # GITHUB_TOKEN authenticates via the packages: write permission below.
  container:
    name: "Container image"
    needs: [ release-please, changes ]
    # A release always publishes. A push only does when the change detection above found
    # something, or when that detection itself broke, in which case falling through to a
    # build keeps a bug in the filter from quietly stopping nightlies altogether.
    if: >-
      always() && !cancelled()
      && (
        github.event_name == 'workflow_dispatch'
        || (
          needs.release-please.result == 'success'
          && (
            needs.release-please.outputs.release_created == 'true'
            || needs.changes.outputs.image == 'true'
            || needs.changes.result == 'failure'
          )
        )
      )
    runs-on: ubuntu-latest
    # A nightly is a rolling tag, so a build still in flight is already obsolete the moment
    # the next push lands: the newer one cancels it rather than queueing a second full push
    # behind it. Releases are keyed by their version and cancel nothing, because a release
    # abandoned halfway through pushing is worse than a slow one.
    concurrency:
      group: >-
        container-${{
          (github.event_name == 'workflow_dispatch' && inputs.container_version)
          || (needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.version)
          || format('nightly-{0}', github.ref)
        }}
      cancel-in-progress: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created != 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: "Determine version and platforms"
        id: params
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.container_version }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"; released=true
          elif [ "$RELEASE_CREATED" = "true" ]; then
            version="$RELEASE_VERSION"; released=true
          else
            version="nightly"; released=false
          fi
          # Both architectures on every build, nightly included. This used to be a release
          # only cost because the Gradle and npm builds ran inside the emulated image; both
          # Dockerfiles now pin their build stage to BUILDPLATFORM, so what QEMU still runs
          # per architecture is creating an account and copying files. A nightly that only
          # exists for amd64 is a nightly nobody on arm64 can test with.
          {
            echo "version=$version"
            echo "released=$released"
            echo "platforms=linux/amd64,linux/arm64"
          } >> "$GITHUB_OUTPUT"

      # Needed for the run stages, which are genuinely built per architecture. The build
      # stages are not emulated; see the BUILDPLATFORM comments in the Dockerfiles.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Compute tags and labels"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          # ghcr.io requires a lowercase path; the organisation name is mixed case.
          images: ghcr.io/onelitefeathernet/ingot
          # Floating major and major.minor tags are only meaningful for real releases.
          tags: |
            type=raw,value=${{ steps.params.outputs.version }}
            type=raw,value=latest,enable=${{ steps.params.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.params.outputs.version }},enable=${{ steps.params.outputs.released == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.params.outputs.version }},enable=${{ steps.params.outputs.released == 'true' }}
          labels: |
            org.opencontainers.image.title=Ingot
            org.opencontainers.image.description=Repository management software for Maven artifacts in the JVM ecosystem
            org.opencontainers.image.vendor=OneLiteFeather
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.params.outputs.version }}

      - name: "Build and push the server image"
        id: server
        # Retried below rather than failing the run outright; see the retry step.
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: ${{ steps.params.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply chain evidence, attached to the image rather than published beside it.
          # The SBOM answers "is the thing I am running affected by this advisory" without
          # unpacking the image; provenance in max mode records which workflow, which
          # commit and which inputs produced it, which is what makes the answer worth
          # anything.
          #
          # Releases only. Each attestation is a further manifest pushed per platform, and
          # on a tag that is overwritten several times a day the evidence is replaced long
          # before anyone reads it. Paying for it there is what pushed this job into GHCR's
          # secondary rate limit; see the change detection job above.
          sbom: ${{ steps.params.outputs.released == 'true' }}
          provenance: ${{ steps.params.outputs.released == 'true' && 'mode=max' || 'false' }}
          # Scoped per image. Sharing one scope makes the two builds evict each other's
          # layers on every run, so neither ever finds the cache it wrote last time.
          cache-from: type=gha,scope=release-server
          cache-to: type=gha,mode=max,scope=release-server

      # GHCR rejects a throttled manifest PUT outright and buildx has no backoff of its own,
      # so one refused request loses an entire multi platform build. Waiting out the window
      # and going again is nearly free: every layer is still in the cache, and what gets
      # replayed is the push.
      #
      # Keep the two `with:` blocks identical.
      - name: "Wait out the registry before retrying the server image"
        if: steps.server.outcome == 'failure'
        run: |
          echo "The server image push failed. GHCR asks for a few minutes, so waiting before the retry."
          sleep 180

      - name: "Retry pushing the server image"
        if: steps.server.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: ${{ steps.params.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: ${{ steps.params.outputs.released == 'true' }}
          provenance: ${{ steps.params.outputs.released == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=release-server
          cache-to: type=gha,mode=max,scope=release-server

      # The dashboard also ships on its own, for deployments that separate it from the
      # server. Same version, so the pair is never ambiguous.
      - name: "Compute dashboard tags and labels"
        id: meta-dashboard
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/onelitefeathernet/ingot-dashboard
          tags: |
            type=raw,value=${{ steps.params.outputs.version }}
            type=raw,value=latest,enable=${{ steps.params.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.params.outputs.version }},enable=${{ steps.params.outputs.released == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.params.outputs.version }},enable=${{ steps.params.outputs.released == 'true' }}
          labels: |
            org.opencontainers.image.title=Ingot Dashboard
            org.opencontainers.image.description=Web dashboard for Ingot, served separately from the repository server
            org.opencontainers.image.vendor=OneLiteFeather
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.params.outputs.version }}

      - name: "Build and push the dashboard image"
        id: dashboard
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          # The repository root, not the module: the image needs branding assets from
          # outside reposilite-frontend.
          context: .
          file: reposilite-frontend/Dockerfile
          platforms: ${{ steps.params.outputs.platforms }}
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          sbom: ${{ steps.params.outputs.released == 'true' }}
          provenance: ${{ steps.params.outputs.released == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=release-dashboard
          cache-to: type=gha,mode=max,scope=release-dashboard

      # Same reasoning as the server retry above. Keep the two `with:` blocks identical.
      - name: "Wait out the registry before retrying the dashboard image"
        if: steps.dashboard.outcome == 'failure'
        run: |
          echo "The dashboard image push failed. GHCR asks for a few minutes, so waiting before the retry."
          sleep 180

      - name: "Retry pushing the dashboard image"
        if: steps.dashboard.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: reposilite-frontend/Dockerfile
          platforms: ${{ steps.params.outputs.platforms }}
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          sbom: ${{ steps.params.outputs.released == 'true' }}
          provenance: ${{ steps.params.outputs.released == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=release-dashboard
          cache-to: type=gha,mode=max,scope=release-dashboard
