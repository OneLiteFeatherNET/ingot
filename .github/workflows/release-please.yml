# Release automation.
#
# Every push to main lets Release Please open or update the release pull request.
# Merging that pull request tags the release, which in the same run publishes the
# Maven artifacts and the container image. Pushes that do not produce a release
# refresh the rolling nightly container image instead.
name: "Release Please"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      container_version:
        description: "Version to rebuild and push the container image for, e.g. 3.5.29. Runs only the container job."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "release-please-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # The action is called directly rather than through the shared
  # OneLiteFeatherNET/workflows/.github/workflows/release-please.yml wrapper, because the
  # publish jobs below have to read its release_created / version outputs.
  release-please:
    name: "Release Please"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes to repo.onelitefeather.dev. The credentials come from
  # ONELITEFEATHER_MAVEN_USERNAME / ONELITEFEATHER_MAVEN_PASSWORD, forwarded by
  # `secrets: inherit` and read in build.gradle.kts.
  maven:
    name: "Maven"
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-publish.yml@v2.4.0
    with:
      java-version: "21"
      java-distribution: "temurin"
      build-task: ":reposilite-backend:shadowJar"
      publish-task: "publish"
    secrets: inherit

  # Attaches the standalone jar to the GitHub release. Without this there is no public
  # download for the jar at all: the Maven job publishes to repo.onelitefeather.dev, which
  # requires credentials even to read, so the standalone installation guide would point at a
  # release page with no artifact on it.
  jar:
    name: "Standalone jar"
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: "Build the standalone jar"
        run: ./gradlew :reposilite-backend:shadowJar

      - name: "Upload the jar to the release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "reposilite-backend/build/libs/ingot-${VERSION}.jar" --clobber

  # Container images go to the GitHub Container Registry. The OneLiteFeather
  # docker-publish reusable targets Harbor and exposes no platforms input, so this is a
  # repository specific job. Publishing to ghcr.io needs no registry secret: the built in
  # GITHUB_TOKEN authenticates via the packages: write permission below.
  container:
    name: "Container image"
    needs: release-please
    if: >-
      always() && !cancelled()
      && (github.event_name == 'workflow_dispatch' || needs.release-please.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: "Determine version and platforms"
        id: params
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.container_version }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"; released=true
          elif [ "$RELEASE_CREATED" = "true" ]; then
            version="$RELEASE_VERSION"; released=true
          else
            version="nightly"; released=false
          fi
          # Both architectures on every build, nightly included. This used to be a release
          # only cost because the Gradle and npm builds ran inside the emulated image; both
          # Dockerfiles now pin their build stage to BUILDPLATFORM, so what QEMU still runs
          # per architecture is creating an account and copying files. A nightly that only
          # exists for amd64 is a nightly nobody on arm64 can test with.
          {
            echo "version=$version"
            echo "released=$released"
            echo "platforms=linux/amd64,linux/arm64"
          } >> "$GITHUB_OUTPUT"

      # Needed for the run stages, which are genuinely built per architecture. The build
      # stages are not emulated; see the BUILDPLATFORM comments in the Dockerfiles.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Compute tags and labels"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          # ghcr.io requires a lowercase path; the organisation name is mixed case.
          images: ghcr.io/onelitefeathernet/ingot
          # Floating major and major.minor tags are only meaningful for real releases.
          tags: |
            type=raw,value=${{ steps.params.outputs.version }}
            type=raw,value=latest,enable=${{ steps.params.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.params.outputs.version }},enable=${{ steps.params.outputs.released == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.params.outputs.version }},enable=${{ steps.params.outputs.released == 'true' }}
          labels: |
            org.opencontainers.image.title=Ingot
            org.opencontainers.image.description=Repository management software for Maven artifacts in the JVM ecosystem
            org.opencontainers.image.vendor=OneLiteFeather
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.params.outputs.version }}

      - name: "Build and push the server image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: ${{ steps.params.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply chain evidence, attached to the image rather than published beside it.
          # The SBOM answers "is the thing I am running affected by this advisory" without
          # unpacking the image; provenance in max mode records which workflow, which
          # commit and which inputs produced it, which is what makes the answer worth
          # anything. buildx attaches a minimal provenance attestation by default, so the
          # SBOM and the extra detail are the part actually being asked for here.
          sbom: true
          provenance: mode=max
          # Scoped per image. Sharing one scope makes the two builds evict each other's
          # layers on every run, so neither ever finds the cache it wrote last time.
          cache-from: type=gha,scope=release-server
          cache-to: type=gha,mode=max,scope=release-server

      # The dashboard also ships on its own, for deployments that separate it from the
      # server. Same version, so the pair is never ambiguous.
      - name: "Compute dashboard tags and labels"
        id: meta-dashboard
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/onelitefeathernet/ingot-dashboard
          tags: |
            type=raw,value=${{ steps.params.outputs.version }}
            type=raw,value=latest,enable=${{ steps.params.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.params.outputs.version }},enable=${{ steps.params.outputs.released == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.params.outputs.version }},enable=${{ steps.params.outputs.released == 'true' }}
          labels: |
            org.opencontainers.image.title=Ingot Dashboard
            org.opencontainers.image.description=Web dashboard for Ingot, served separately from the repository server
            org.opencontainers.image.vendor=OneLiteFeather
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.params.outputs.version }}

      - name: "Build and push the dashboard image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          # The repository root, not the module: the image needs branding assets from
          # outside reposilite-frontend.
          context: .
          file: reposilite-frontend/Dockerfile
          platforms: ${{ steps.params.outputs.platforms }}
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-dashboard
          cache-to: type=gha,mode=max,scope=release-dashboard
