# OpenSSF Scorecard. Measures the repository and reports; it does not gate merges.
#
# Runs on pushes to main and once a week. It never runs on pull requests, so no token with
# write scope is offered to a fork.
name: "Scorecard"

on:
  push:
    branches: [ "main" ]
  schedule:
    # Weekly, Monday 13:28 UTC. Keeps the Maintained check current between pushes.
    - cron: "28 13 * * 1"

# Read-only by default. The analysis job declares what it needs on its own.
permissions: read-all

jobs:
  analysis:
    name: "Scorecard analysis"
    runs-on: ubuntu-latest
    permissions:
      # Uploads the SARIF result to the code scanning dashboard.
      security-events: write
      # Publishes the result to the OpenSSF API (publish_results below).
      id-token: write
      contents: read
      actions: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: "Run the Scorecard analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "Upload the SARIF artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: "scorecard-sarif"
          path: results.sarif
          retention-days: 5

      - name: "Upload the SARIF result to code scanning"
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
