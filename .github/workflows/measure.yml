# Throwaway measurement workflow. Never merged, no pull request.
name: "Measure"
on:
  workflow_dispatch:
    inputs:
      touch:
        description: "Change one backend source before the build"
        default: "no"
  push:
    branches: [ "ci/measure-light-checks" ]
permissions:
  contents: read
jobs:
  measure:
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "current-build-j17", java: "17", opts: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true", args: "build test -x integration -x integrationTest", extra: "" }
          - { name: "slim-test-j17", java: "17", opts: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true", args: "test -x integration -x integrationTest", extra: "" }
          - { name: "slim-nocache-j17", java: "17", opts: "-Dorg.gradle.parallel=true", args: "test -x integration -x integrationTest", extra: "" }
          - { name: "slim-configcache-j17", java: "17", opts: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true", args: "test -x integration -x integrationTest", extra: "--configuration-cache" }
          - { name: "backend-unit-j21-default", java: "21", opts: "", args: ":reposilite-backend:test", extra: "" }
          - { name: "backend-unit-j21-buildcache", java: "21", opts: "", args: ":reposilite-backend:test", extra: "--build-cache" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-read-only: false
      - name: "Change one backend source"
        if: ${{ inputs.touch == 'yes' }}
        run: |
          f=$(find reposilite-backend/src/main/kotlin -name '*.kt' | sort | head -1)
          echo "// measure $GITHUB_RUN_ID" >> "$f"
          echo "touched $f"
      - name: "Compile only"
        env:
          GRADLE_OPTS: ${{ matrix.opts }}
          EXTRA: ${{ matrix.extra }}
        run: |
          s=$(date +%s); ./gradlew classes testClasses --no-daemon --console=plain $EXTRA || true; e=$(date +%s)
          echo "compile_seconds=$((e-s))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Run"
        env:
          GRADLE_OPTS: ${{ matrix.opts }}
          EXTRA: ${{ matrix.extra }}
          TASKS: ${{ matrix.args }}
        run: |
          s=$(date +%s); ./gradlew $TASKS $EXTRA --no-daemon --console=plain | tee "$RUNNER_TEMP/gradle.log"; e=$(date +%s)
          echo "run_seconds=$((e-s))" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "from_cache_lines=$(grep -c 'FROM-CACHE' "$RUNNER_TEMP/gradle.log" || true)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "uptodate_lines=$(grep -c 'UP-TO-DATE' "$RUNNER_TEMP/gradle.log" || true)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Slowest tests"
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows=[]
          for p in glob.glob("**/build/test-results/test/*.xml", recursive=True):
              r=ET.parse(p).getroot()
              rows.append((float(r.get("time",0)), r.get("name"), r.get("tests")))
          rows.sort(reverse=True)
          print("total_test_seconds_sum=%.1f classes=%d" % (sum(x[0] for x in rows), len(rows)))
          for t,n,c in rows[:15]: print("%.1f %s (%s tests)" % (t,n,c))
          PY
